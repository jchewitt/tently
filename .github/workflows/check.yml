name: Standalone checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
  windows-storage-and-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Native Windows storage, launchers, source indexing, integrity and MCP startup
        run: pnpm exec vitest run src/storage/atomic-rename.test.ts src/repository/git.test.ts tests/snapshot-lifecycle.test.ts tests/mcp-startup.test.ts src/extraction/codex-command.test.ts src/extraction/codex-auth.test.ts src/extraction/semantic-process.test.ts src/extraction/scip-project.test.ts src/extraction/document.test.ts src/extraction/module-request.test.ts src/extraction/routing.test.ts tests/routing.test.ts src/graph/ranking.test.ts src/graph/query.test.ts src/application/overlay.test.ts scripts/inventory.test.ts scripts/evaluation/protocol.test.ts
      - name: Check repository extraction inventory on Windows
        run: pnpm inventory:check
      - name: Check generated license notices on Windows
        run: pnpm context-graph:licenses:check
